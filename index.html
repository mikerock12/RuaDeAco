<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#070913" />
    <meta name="description" content="Rua de Aço, jogo de luta 2D em pixel art." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Rua de Aço</title>
  </head>
  <body>
    <main id="app" aria-label="Rua de Aço">
      <div id="game-shell">
        <div id="game-container" aria-label="Área do jogo"></div>
        <div id="touch-controls" aria-hidden="true"></div>
      </div>
      <div id="rotate-warning" role="status" aria-live="polite">
        <span class="rotate-icon" aria-hidden="true">↻</span>
        <strong>Gire o aparelho</strong>
        <span>Rua de Aço foi feito para jogar na horizontal.</span>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
