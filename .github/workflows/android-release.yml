name: Android release

# Gera o AAB (Play Store) e o APK (instalação direta) otimizados.
# Disparo: push no master (código do jogo ou do Android), tag android-v* ou manualmente. Se os segredos de assinatura
# existirem, os arquivos já saem assinados; senão saem sem assinatura e
# são assinados depois com a chave de upload (docs/PLAY_STORE.md).
on:
  push:
    branches: [master]
    paths: ['android/**', 'src/**', 'public/**', 'package.json', '.github/workflows/android-release.yml']
    tags: ['android-v*']
  pull_request:
    branches: [master]
    paths: ['android/**', 'package.json', '.github/workflows/android-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: AAB e APK de release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL }}
      KEYSTORE_B64: ${{ secrets.RUA_UPLOAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Enxuga o pacote (OGG basta no WebView; MP3 é só fallback da web)
        run: |
          rm -f android/app/src/main/assets/public/assets/audio/music/*.mp3
          du -sh android/app/src/main/assets/public
      - name: Prepara chave de upload (opcional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "RUA_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Compila
        working-directory: android
        env:
          RUA_UPLOAD_STORE_PASSWORD: ${{ secrets.RUA_UPLOAD_STORE_PASSWORD }}
          RUA_UPLOAD_KEY_PASSWORD: ${{ secrets.RUA_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Reúne os arquivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/rua-de-aco-release.aab
          cp android/app/build/outputs/apk/release/*.apk out/rua-de-aco-release.apk
          ls -la out
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: rua-de-aco-android
          path: out/
          retention-days: 14
      - name: Publica na página de releases (pré-lançamento)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          TAG="android-v${VERSION}"
          echo "Versão ${VERSION} -> ${TAG}"
          cp out/rua-de-aco-release.aab "out/rua-de-aco-${VERSION}-unsigned.aab"
          cp out/rua-de-aco-release.apk "out/rua-de-aco-${VERSION}-unsigned.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/rua-de-aco-${VERSION}-unsigned.* --clobber
          else
            gh release create "$TAG" out/rua-de-aco-${VERSION}-unsigned.* --prerelease --target "$GITHUB_SHA" \
              --title "Android ${VERSION} (build sem assinatura)" \
              --notes "Build automático do Android ${VERSION} (commit ${GITHUB_SHA}). Os arquivos estão sem assinatura: assine com a chave de upload antes de enviar à Play (docs/PLAY_STORE.md)."
          fi
